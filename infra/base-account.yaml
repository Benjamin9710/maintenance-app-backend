AWSTemplateFormatVersion: '2010-09-09'
Description: Base account-level infrastructure for backend-app (artifact bucket + CI deploy role)

Parameters:
  EnvironmentName:
    Type: String
    Description: Short environment name (e.g. dev, prod)
    AllowedPattern: '^[a-zA-Z0-9-]+$'

  ArtifactBucketName:
    Type: String
    Description: Optional explicit name for the SAM artifact bucket
    Default: ''

  DeployRoleName:
    Type: String
    Description: IAM role name for CI/CD deployments
    Default: ''

Conditions:
  UseGeneratedBucketName: !Equals [!Ref ArtifactBucketName, '']
  UseGeneratedDeployRoleName: !Equals [!Ref DeployRoleName, '']

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - UseGeneratedBucketName
        - !Sub 'backend-app-artifacts-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}'
        - !Ref ArtifactBucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - UseGeneratedDeployRoleName
        - !Sub 'backend-app-deploy-${EnvironmentName}'
        - !Ref DeployRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - sts:AssumeRole
      Path: "/service/"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'backend-app-lambda-${EnvironmentName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/service/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub 'backend-app-lambda-dynamo-${EnvironmentName}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: !Sub 'backend-app-lambda-cognito-${EnvironmentName}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:DescribeUserPool
                Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  DbMasterUsernameSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'backend-app-${EnvironmentName}-db-master-username'

  DbMasterPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'backend-app-${EnvironmentName}-db-master-password'

  DbCredentialsAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'backend-app-db-credentials-access-${EnvironmentName}'
      Roles:
        - !Ref DeployRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Ref DbMasterUsernameSecret
              - !Ref DbMasterPasswordSecret

  DeployRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'backend-app-deploy-${EnvironmentName}'
      Description: CI/CD deployment policy for backend-app SAM stacks
      Roles:
        - !Ref DeployRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Allow managing CloudFormation stacks for this app in this account/region
          - Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:ValidateTemplate
              - cloudformation:ListStackResources
            Resource: "*"

          # Allow using the artifact bucket for SAM uploads
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'

          # Allow managing Lambda functions for this app only (scoped by function name prefix)
          - Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:ListFunctions
              - lambda:TagResource
              - lambda:UntagResource
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:backend-app-*'

          # Allow managing CloudWatch Logs and API Gateway resources (can be narrowed later)
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - apigateway:GET
              - apigateway:POST
              - apigateway:PUT
              - apigateway:DELETE
              - apigateway:PATCH
              - apigateway:TagResource
              - apigateway:UntagResource
            Resource: "*"

          # Allow passing IAM roles for Lambda that follow the backend-app-lambda-* naming convention
          - Effect: Allow
            Action:
              - iam:PassRole
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/backend-app-lambda-*'

Outputs:
  ArtifactBucketName:
    Description: Name of the S3 bucket used for SAM artifacts
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub 'backend-app-${EnvironmentName}-ArtifactBucketName'

  ArtifactBucketArn:
    Description: ARN of the S3 bucket used for SAM artifacts
    Value: !GetAtt ArtifactBucket.Arn
    Export:
      Name: !Sub 'backend-app-${EnvironmentName}-ArtifactBucketArn'

  DeployRoleArn:
    Description: ARN of the IAM role used by CI/CD for deployments
    Value: !GetAtt DeployRole.Arn
    Export:
      Name: !Sub 'backend-app-${EnvironmentName}-DeployRoleArn'

  LambdaExecutionRoleArn:
    Description: ARN of the IAM role used by Lambda functions
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub 'backend-app-${EnvironmentName}-LambdaExecutionRoleArn'
