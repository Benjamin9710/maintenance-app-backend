      Environment:
        Variables:
          COGNITO_CONTRACTOR_USER_POOL_ID: !Ref CognitoContractorUserPool
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
      Description: Admin function to create contractors (deployed 2026-02-21)
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
