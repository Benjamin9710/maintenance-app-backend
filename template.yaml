AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Backend App - SAM template

Parameters:
  EnvironmentName:
    Type: String
    Description: Short environment name (e.g. dev, prod, local)
    Default: local
    AllowedPattern: "^[a-zA-Z0-9-]+$"

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:5173"
          - "http://localhost:5174"
          - "http://127.0.0.1:5173"
          - "http://127.0.0.1:5174"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 3600
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: openapi/api.yaml

  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-HealthCheckFunction"
      CodeUri: .
      Handler: src/handlers/healthCheck.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/healthCheck.ts

  HealthCheckFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HealthCheckFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-MeFunction"
      CodeUri: .
      Handler: src/handlers/me.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
      Environment:
        Variables:
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/me.ts

  DbHealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-DbHealthFunction"
      CodeUri: .
      Handler: src/handlers/dbHealth.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/dbHealth.ts
        Loader:
          - .pem=text

  DynamoHealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-DynamoHealthFunction"
      CodeUri: .
      Handler: src/handlers/dynamoHealth.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/dynamoHealth.ts

  MeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  DbHealthFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DbHealthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  DynamoHealthFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DynamoHealthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  AuthSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AuthSessionFunction"
      CodeUri: .
      Handler: src/handlers/authSession.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
      Environment:
        Variables:
          COGNITO_MANAGER_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_MANAGER_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
          COGNITO_CONTRACTOR_USER_POOL_ID: !Ref CognitoContractorUserPool
          COGNITO_CONTRACTOR_USER_POOL_CLIENT_ID: !Ref CognitoContractorUserPoolClient
          COGNITO_ADMIN_USER_POOL_ID: !Ref CognitoAdminUserPool
          COGNITO_ADMIN_USER_POOL_CLIENT_ID: !Ref CognitoAdminUserPoolClient
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/authSession.ts

  AuthSessionFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthSessionFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  AuthLogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AuthLogoutFunction"
      CodeUri: .
      Handler: src/handlers/authLogout.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
      Environment:
        Variables:
          COGNITO_MANAGER_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_MANAGER_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
          COGNITO_CONTRACTOR_USER_POOL_ID: !Ref CognitoContractorUserPool
          COGNITO_CONTRACTOR_USER_POOL_CLIENT_ID: !Ref CognitoContractorUserPoolClient
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/authLogout.ts

  AuthLogoutFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthLogoutFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  AdminListManagersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AdminListManagersFunction"
      CodeUri: .
      Handler: src/handlers/adminListManagers.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
      Environment:
        Variables:
          COGNITO_MANAGER_USER_POOL_ID: !Ref CognitoUserPool
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
      Description: Admin function to list managers (deployed 2026-02-17, updated 2026-02-19 with Cognito permissions)
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/adminListManagers.ts

  AdminListManagersFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
