AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Backend App - SAM template

Parameters:
  EnvironmentName:
    Type: String
    Description: Short environment name (e.g. dev, prod, local)
    Default: local
    AllowedPattern: '^[a-zA-Z0-9-]+$'

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      CorsConfiguration:
        AllowOrigins:
          - 'http://localhost:5173'
          - 'http://localhost:5174'
          - 'http://127.0.0.1:5173'
          - 'http://127.0.0.1:5174'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 3600
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: openapi/api.yaml

  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-HealthCheckFunction'
      CodeUri: .
      Handler: src/handlers/healthCheck.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: 'backend-app-${EnvironmentName}-LambdaExecutionRoleArn'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/healthCheck.ts

  HealthCheckFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HealthCheckFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-MeFunction'
      CodeUri: .
      Handler: src/handlers/me.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: 'backend-app-${EnvironmentName}-LambdaExecutionRoleArn'
      Environment:
        Variables:
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/me.ts

  DbHealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-DbHealthFunction'
      CodeUri: .
      Handler: src/handlers/dbHealth.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: 'backend-app-${EnvironmentName}-LambdaExecutionRoleArn'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/dbHealth.ts
        Loader:
          - .pem=text

  DynamoHealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-DynamoHealthFunction'
      CodeUri: .
      Handler: src/handlers/dynamoHealth.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: 'backend-app-${EnvironmentName}-LambdaExecutionRoleArn'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/dynamoHealth.ts

  MeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  DbHealthFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DbHealthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  DynamoHealthFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DynamoHealthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  AuthSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-AuthSessionFunction'
      CodeUri: .
      Handler: src/handlers/authSession.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: 'backend-app-${EnvironmentName}-LambdaExecutionRoleArn'
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/authSession.ts

  AuthSessionFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthSessionFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  AuthLogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-AuthLogoutFunction'
      CodeUri: .
      Handler: src/handlers/authLogout.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: 'backend-app-${EnvironmentName}-LambdaExecutionRoleArn'
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/authLogout.ts

  AuthLogoutFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthLogoutFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-${EnvironmentName}-user-pool'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-${EnvironmentName}-user-pool-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - 'http://localhost:5173/'
        - 'http://localhost:5174/'
      LogoutURLs:
        - 'http://localhost:5173/'
        - 'http://localhost:5174/'

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${AWS::StackName}-${EnvironmentName}-auth'
      UserPoolId: !Ref CognitoUserPool

  DynamoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'backend-app-table'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'backend-app-sessions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true

Outputs:
  HttpApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
  CognitoUserPoolId:
    Description: ID of the Cognito User Pool for this stack
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Client ID for the Cognito User Pool in this stack
    Value: !Ref CognitoUserPoolClient
  CognitoUserPoolDomain:
    Description: Cognito User Pool domain for this stack
    Value: !Sub 'https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
