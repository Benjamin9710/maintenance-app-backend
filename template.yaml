          - src/handlers/adminCreateContractor.ts

  AdminCreateContractorFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminCreateContractorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  AdminListManagerPropertiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AdminListManagerPropertiesFunction"
      CodeUri: .
      Handler: src/handlers/adminListManagerProperties.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
      Environment:
        Variables:
          DB_HOST: "{{resolve:secretsmanager:DB_HOST:SecretString}}"
          DB_PORT: "{{resolve:secretsmanager:DB_PORT:SecretString}}"
          DB_NAME: "{{resolve:secretsmanager:DB_NAME:SecretString}}"
          DB_USER: "{{resolve:secretsmanager:DB_USER:SecretString}}"
          DB_PASSWORD: "{{resolve:secretsmanager:DB_PASSWORD:SecretString}}"
          DB_SSL: "true"
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
      Description: Admin function to list properties for a manager
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/adminListManagerProperties.ts
        Loader:
          - .pem=text

  AdminListManagerPropertiesFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminListManagerPropertiesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  AdminCreatePropertyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AdminCreatePropertyFunction"
      CodeUri: .
      Handler: src/handlers/adminCreateProperty.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
      Environment:
        Variables:
          DB_HOST: "{{resolve:secretsmanager:DB_HOST:SecretString}}"
          DB_PORT: "{{resolve:secretsmanager:DB_PORT:SecretString}}"
          DB_NAME: "{{resolve:secretsmanager:DB_NAME:SecretString}}"
          DB_USER: "{{resolve:secretsmanager:DB_USER:SecretString}}"
          DB_PASSWORD: "{{resolve:secretsmanager:DB_PASSWORD:SecretString}}"
          DB_SSL: "true"
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
      Description: Admin function to create properties
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/adminCreateProperty.ts
        Loader:
          - .pem=text

  AdminCreatePropertyFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminCreatePropertyFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  AdminGetPropertyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AdminGetPropertyFunction"
      CodeUri: .
      Handler: src/handlers/adminGetProperty.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
      Environment:
        Variables:
          DB_HOST: "{{resolve:secretsmanager:DB_HOST:SecretString}}"
          DB_PORT: "{{resolve:secretsmanager:DB_PORT:SecretString}}"
          DB_NAME: "{{resolve:secretsmanager:DB_NAME:SecretString}}"
          DB_USER: "{{resolve:secretsmanager:DB_USER:SecretString}}"
          DB_PASSWORD: "{{resolve:secretsmanager:DB_PASSWORD:SecretString}}"
          DB_SSL: "true"
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
      Description: Admin function to get a property by ID
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/adminGetProperty.ts
        Loader:
          - .pem=text

  AdminGetPropertyFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminGetPropertyFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  AdminUpdatePropertyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AdminUpdatePropertyFunction"
      CodeUri: .
      Handler: src/handlers/adminUpdateProperty.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
      Environment:
        Variables:
          DB_HOST: "{{resolve:secretsmanager:DB_HOST:SecretString}}"
          DB_PORT: "{{resolve:secretsmanager:DB_PORT:SecretString}}"
          DB_NAME: "{{resolve:secretsmanager:DB_NAME:SecretString}}"
          DB_USER: "{{resolve:secretsmanager:DB_USER:SecretString}}"
          DB_PASSWORD: "{{resolve:secretsmanager:DB_PASSWORD:SecretString}}"
          DB_SSL: "true"
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
      Description: Admin function to update properties
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/adminUpdateProperty.ts
        Loader:
          - .pem=text

  AdminUpdatePropertyFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminUpdatePropertyFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  AdminArchivePropertyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-AdminArchivePropertyFunction"
      CodeUri: .
      Handler: src/handlers/adminArchiveProperty.handler
      Runtime: nodejs22.x
      Role:
        Fn::ImportValue:
          Fn::Sub: "backend-app-${EnvironmentName}-LambdaExecutionRoleArn"
      Environment:
        Variables:
          DB_HOST: "{{resolve:secretsmanager:DB_HOST:SecretString}}"
          DB_PORT: "{{resolve:secretsmanager:DB_PORT:SecretString}}"
          DB_NAME: "{{resolve:secretsmanager:DB_NAME:SecretString}}"
          DB_USER: "{{resolve:secretsmanager:DB_USER:SecretString}}"
          DB_PASSWORD: "{{resolve:secretsmanager:DB_PASSWORD:SecretString}}"
          DB_SSL: "true"
          DYNAMO_REGION: !Ref AWS::Region
          DYNAMO_SESSIONS_TABLE_NAME: !Ref SessionsTable
      Description: Admin function to archive properties
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints:
          - src/handlers/adminArchiveProperty.ts
        Loader:
          - .pem=text

  AdminArchivePropertyFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminArchivePropertyFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-${EnvironmentName}-user-pool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-${EnvironmentName}-user-pool-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - "http://localhost:5173/"
        - "http://localhost:5174/"
      LogoutURLs:
        - "http://localhost:5173/"
        - "http://localhost:5174/"

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${AWS::StackName}-${EnvironmentName}-auth"
      UserPoolId: !Ref CognitoUserPool

  CognitoContractorUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-${EnvironmentName}-contractor-user-pool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  CognitoContractorUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-${EnvironmentName}-contractor-user-pool-client"
      UserPoolId: !Ref CognitoContractorUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - "http://localhost:5173/"
        - "http://localhost:5174/"
      LogoutURLs:
        - "http://localhost:5173/"
        - "http://localhost:5174/"

  CognitoContractorUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${AWS::StackName}-${EnvironmentName}-contractor-auth"
      UserPoolId: !Ref CognitoContractorUserPool

  CognitoAdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-${EnvironmentName}-admin-user-pool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  CognitoAdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-${EnvironmentName}-admin-user-pool-client"
      UserPoolId: !Ref CognitoAdminUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - "http://localhost:5173/"
        - "http://localhost:5174/"
      LogoutURLs:
        - "http://localhost:5173/"
        - "http://localhost:5174/"

  CognitoAdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${AWS::StackName}-${EnvironmentName}-admin-auth"
      UserPoolId: !Ref CognitoAdminUserPool

  DynamoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "backend-app-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "backend-app-sessions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true

Outputs:
  HttpApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  CognitoUserPoolId:
    Description: ID of the Cognito User Pool for this stack
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Client ID for the Cognito User Pool in this stack
    Value: !Ref CognitoUserPoolClient
  CognitoUserPoolDomain:
    Description: Cognito User Pool domain for this stack
    Value: !Sub "https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  CognitoContractorUserPoolId:
    Description: ID of the Cognito Contractor User Pool for this stack
    Value: !Ref CognitoContractorUserPool
  CognitoContractorUserPoolClientId:
    Description: Client ID for the Cognito Contractor User Pool in this stack
    Value: !Ref CognitoContractorUserPoolClient
  CognitoContractorUserPoolDomain:
    Description: Cognito Contractor User Pool domain for this stack
    Value: !Sub "https://${CognitoContractorUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  CognitoAdminUserPoolId:
    Description: ID of the Cognito Admin User Pool for this stack
    Value: !Ref CognitoAdminUserPool
  CognitoAdminUserPoolClientId:
    Description: Client ID for the Cognito Admin User Pool in this stack
    Value: !Ref CognitoAdminUserPoolClient
  CognitoAdminUserPoolDomain:
    Description: Cognito Admin User Pool domain for this stack
    Value: !Sub "https://${CognitoAdminUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
