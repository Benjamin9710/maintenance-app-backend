openapi: 3.0.3
info:
  title: Backend App API
  version: 0.1.0
servers:
  - url: /v1
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Successful health check
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HealthCheckFunction.Arn}/invocations

  /me:
    get:
      summary: Get current user identity
      operationId: getMe
      responses:
        '200':
          description: User identity information
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub:
                    type: string
                  email:
                    type: string
                  email_verified:
                    type: boolean
                  given_name:
                    type: string
                  family_name:
                    type: string
                  exp:
                    type: number
                  iat:
                    type: number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MeFunction.Arn}/invocations

  /db/health:
    get:
      summary: Database health check
      operationId: getDbHealth
      responses:
        '200':
          description: Database reachable and responding
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  latencyMs:
                    type: number
        '500':
          description: Database not reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DbHealthFunction.Arn}/invocations

  /dynamo/health:
    get:
      summary: DynamoDB health check
      operationId: getDynamoHealth
      responses:
        '200':
          description: DynamoDB reachable and responding
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  latencyMs:
                    type: number
        '500':
          description: DynamoDB not reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DynamoHealthFunction.Arn}/invocations

  /auth/session:
    post:
      summary: Create API session from Cognito ID token
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
              required:
                - idToken
      responses:
        '200':
          description: API session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  user:
                    type: object
                    properties:
                      sub:
                        type: string
                      email:
                        type: string
                      isProfileComplete:
                        type: boolean
                required:
                  - sessionToken
                  - expiresAt
                  - user
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthSessionFunction.Arn}/invocations

  /auth/logout:
    post:
      summary: Logout API session
      operationId: logoutSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: logged_out
        '401':
          description: Unauthorized
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLogoutFunction.Arn}/invocations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
