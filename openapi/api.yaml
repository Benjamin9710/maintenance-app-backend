                  type: string
                  description: Property postcode
                country:
                  type: string
                  description: Property country
                timezone:
                  type: string
                  nullable: true
                  description: Property timezone
              required: []
      responses:
        "200":
          description: Property updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
