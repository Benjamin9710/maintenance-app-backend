                  createdAt:
                    type: string
                    format: date-time
                    description: Creation timestamp
                  updatedAt:
                    type: string
                    format: date-time
                    description: Last update timestamp
                  archivedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Archive timestamp (null if not archived)
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Property not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminUpdatePropertyFunction.Arn}/invocations

  /admin/properties/{propertyId}/archive:
    post:
      summary: Archive property (admin only)
      operationId: archiveProperty
      security:
        - bearerAuth: []
      description: Archive an existing property
      parameters:
        - name: propertyId
          in: path
          required: true
          description: Property ID
          schema:
            type: string
      responses:
        "200":
          description: Property archived successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Property ID
                  ownerManagerSub:
