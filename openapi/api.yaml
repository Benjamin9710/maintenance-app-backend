                  postcode:
                    type: string
                    description: Property postcode
                  country:
                    type: string
                    description: Property country
                  timezone:
                    type: string
                    nullable: true
                    description: Property timezone
                  createdAt:
                    type: string
                    format: date-time
                    description: Creation timestamp
                  updatedAt:
                    type: string
                    format: date-time
                    description: Last update timestamp
                  archivedAt:
                    type: string
                    format: date-time
