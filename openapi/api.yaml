openapi: 3.0.0
info:
  title: Backend App API
  version: 1.0.0
  description: API for maintenance app backend

servers:
  - url: https://{ApiId}.execute-api.{Region}.amazonaws.com/v1
    description: Production server

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      description: Basic health check endpoint
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HealthCheckFunction.Arn}/invocations

  /db/health:
    get:
      summary: Database health check
      operationId: dbHealth
      description: Check database connectivity
      responses:
        "200":
          description: Database connection successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: connected
        "500":
          description: Database connection failed
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DbHealthFunction.Arn}/invocations

  /dynamo/health:
    get:
      summary: DynamoDB health check
      operationId: dynamoHealth
      description: Check DynamoDB connectivity
      responses:
        "200":
          description: DynamoDB connection successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: connected
        "500":
          description: DynamoDB connection failed
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DynamoHealthFunction.Arn}/invocations

  /me:
    get:
      summary: Get current user info
      operationId: me
      security:
        - bearerAuth: []
      description: Retrieve information about the currently authenticated user
      responses:
        "200":
          description: User information
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub:
                    type: string
                    description: User subject identifier
                  email:
                    type: string
                    nullable: true
                    description: User email address
                  persona:
                    type: string
                    enum: [manager, contractor, admin]
                    description: User persona/role
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MeFunction.Arn}/invocations

  /auth/session:
    post:
      summary: Create session
      operationId: createSession
      description: Create a new session after successful authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: JWT token from Cognito
                persona:
                  type: string
                  enum: [manager, contractor, admin]
                  description: User persona/role
              required:
                - token
                - persona
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Session token
                  expiresAt:
                    type: integer
                    description: Token expiration timestamp
        "400":
          description: Bad request
        "401":
          description: Unauthorized
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthSessionFunction.Arn}/invocations

  /auth/logout:
    post:
      summary: Logout session
      operationId: logoutSession
      security:
        - bearerAuth: []
      description: Invalidate the current session
      responses:
        "200":
          description: Session invalidated
        "401":
          description: Unauthorized
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLogoutFunction.Arn}/invocations

  /admin/managers:
    get:
      summary: List managers (admin only)
      operationId: listManagers
      security:
        - bearerAuth: []
      description: Retrieve list of all managers in the system with pagination support (updated 2026-02-19)
      parameters:
        - name: limit
          in: query
          description: Maximum number of managers to return (1-60, default = 60)
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 60
        - name: paginationToken
          in: query
          description: Token for pagination (from previous response)
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  managers:
                    type: array
                    items:
                      type: object
                      properties:
                        cognitoSub:
                          type: string
                        username:
                          type: string
                        email:
                          type: string
                          nullable: true
                        displayName:
                          type: string
                          nullable: true
                        givenName:
                          type: string
                          nullable: true
                        familyName:
                          type: string
                          nullable: true
                        phoneNumber:
                          type: string
                          nullable: true
                        status:
                          type: string
                        enabled:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        lastModifiedAt:
                          type: string
                          format: date-time
                  paginationToken:
                    type: string
                    nullable: true
                    description: Token for next page (null if no more pages)
                  hasMore:
                    type: boolean
                    description: Whether more pages are available
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminListManagersFunction.Arn}/invocations

    post:
      summary: Create manager (admin only)
      operationId: createManager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                givenName:
                  type: string
                familyName:
                  type: string
                phoneNumber:
                  type: string
                  description: E.164 format recommended (e.g. +61400111222)
              required:
                - email
                - displayName
                - givenName
                - familyName
                - phoneNumber
      responses:
        "200":
          description: Manager created
          content:
            application/json:
              schema:
                type: object
                properties:
                  cognitoSub:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
                    nullable: true
                  displayName:
                    type: string
                    nullable: true
                  givenName:
                    type: string
                    nullable: true
                  familyName:
                    type: string
                    nullable: true
                  phoneNumber:
                    type: string
                    nullable: true
                  status:
                    type: string
                  enabled:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                  lastModifiedAt:
                    type: string
                    format: date-time
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminCreateManagerFunction.Arn}/invocations

  /admin/contractors:
    get:
      summary: List contractors (admin only)
      operationId: listContractors
      security:
        - bearerAuth: []
      description: Retrieve list of all contractors in the system with pagination support
      parameters:
        - name: limit
          in: query
          description: Maximum number of contractors to return (1-60, default = 60)
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 60
        - name: paginationToken
          in: query
          description: Token for pagination (from previous response)
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of contractors
          content:
            application/json:
              schema:
                type: object
                properties:
                  contractors:
                    type: array
                    items:
                      type: object
                      properties:
                        cognitoSub:
                          type: string
                        username:
                          type: string
                        email:
                          type: string
                          nullable: true
                        displayName:
                          type: string
                          nullable: true
                        givenName:
                          type: string
                          nullable: true
                        familyName:
                          type: string
                          nullable: true
                        phoneNumber:
                          type: string
                          nullable: true
                        status:
                          type: string
                        enabled:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        lastModifiedAt:
                          type: string
                          format: date-time
                  paginationToken:
                    type: string
                    nullable: true
                    description: Token for next page (null if no more pages)
                  hasMore:
                    type: boolean
                    description: Whether more pages are available
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminListContractorsFunction.Arn}/invocations

    post:
      summary: Create contractor (admin only)
      operationId: createContractor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                givenName:
                  type: string
                familyName:
                  type: string
                phoneNumber:
                  type: string
                  description: E.164 format recommended (e.g. +61400111222)
              required:
                - email
                - displayName
                - givenName
                - familyName
                - phoneNumber
      responses:
        "200":
          description: Contractor created
          content:
            application/json:
              schema:
                type: object
                properties:
                  cognitoSub:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
                    nullable: true
                  displayName:
                    type: string
                    nullable: true
                  givenName:
                    type: string
                    nullable: true
                  familyName:
                    type: string
                    nullable: true
                  phoneNumber:
                    type: string
                    nullable: true
                  status:
                    type: string
                  enabled:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                  lastModifiedAt:
                    type: string
                    format: date-time
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminCreateContractorFunction.Arn}/invocations

  /admin/managers/{managerSub}/properties:
    get:
      summary: List properties for a manager (admin only)
      operationId: listManagerProperties
      security:
        - bearerAuth: []
      description: Retrieve list of properties for a specific manager
      parameters:
        - name: managerSub
          in: path
          required: true
          description: Manager Cognito sub identifier
          schema:
            type: string
        - name: includeArchived
          in: query
          description: Include archived properties in results
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of properties for the manager
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Property ID
                        owner_manager_sub:
                          type: string
                          description: Manager sub who owns this property
                        name:
                          type: string
                          description: Property name
                        address_line1:
                          type: string
                          description: Property address line 1
                        address_line2:
                          type: string
                          nullable: true
                          description: Property address line 2
                        suburb:
                          type: string
                          description: Property suburb
                        state:
                          type: string
                          description: Property state
                        postcode:
                          type: string
                          description: Property postcode
                        country:
                          type: string
                          description: Property country
                        timezone:
                          type: string
                          nullable: true
                          description: Property timezone
                        created_at:
                          type: string
                          format: date-time
                          description: Creation timestamp
                        updated_at:
                          type: string
                          format: date-time
                          description: Last update timestamp
                        archived_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: Archive timestamp (null if not archived)
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminListManagerPropertiesFunction.Arn}/invocations

    post:
      summary: Create property for a manager (admin only)
      operationId: createPropertyForManager
      security:
        - bearerAuth: []
      description: Create a new property for a specific manager
      parameters:
        - name: managerSub
          in: path
          required: true
          description: Manager Cognito sub identifier who will own this property
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Property name
                address_line1:
                  type: string
                  description: Property address line 1
                address_line2:
                  type: string
                  nullable: true
                  description: Property address line 2
                suburb:
                  type: string
                  description: Property suburb
                state:
                  type: string
                  description: Property state
                postcode:
                  type: string
                  description: Property postcode
                country:
                  type: string
                  description: Property country
                timezone:
                  type: string
                  nullable: true
                  description: Property timezone
              required:
                - name
                - address_line1
                - suburb
                - state
                - postcode
                - country
      responses:
        "200":
          description: Property created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Property ID
                  owner_manager_sub:
                    type: string
                    description: Manager sub who owns this property
                  name:
                    type: string
                    description: Property name
                  address_line1:
                    type: string
                    description: Property address line 1
                  address_line2:
                    type: string
                    nullable: true
                    description: Property address line 2
                  suburb:
                    type: string
                    description: Property suburb
                  state:
                    type: string
                    description: Property state
                  postcode:
                    type: string
                    description: Property postcode
                  country:
                    type: string
                    description: Property country
                  timezone:
                    type: string
                    nullable: true
                    description: Property timezone
                  created_at:
                    type: string
                    format: date-time
                    description: Creation timestamp
                  updated_at:
                    type: string
                    format: date-time
                    description: Last update timestamp
                  archived_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Archive timestamp (null if not archived)
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminCreatePropertyFunction.Arn}/invocations

  /admin/properties:
    post:
      summary: Create property (admin only)
      operationId: createProperty
      security:
        - bearerAuth: []
      description: Create a new property for a manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                owner_manager_sub:
                  type: string
                  description: Manager sub who will own this property
                name:
                  type: string
                  description: Property name
                address_line1:
                  type: string
                  description: Property address line 1
                address_line2:
                  type: string
                  nullable: true
                  description: Property address line 2
                suburb:
                  type: string
                  description: Property suburb
                state:
                  type: string
                  description: Property state
                postcode:
                  type: string
                  description: Property postcode
                country:
                  type: string
                  description: Property country
                timezone:
                  type: string
                  nullable: true
                  description: Property timezone
              required:
                - owner_manager_sub
                - name
                - address_line1
                - suburb
                - state
                - postcode
                - country
      responses:
        "200":
          description: Property created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Property ID
                  owner_manager_sub:
                    type: string
                    description: Manager sub who owns this property
                  name:
                    type: string
                    description: Property name
                  address_line1:
                    type: string
                    description: Property address line 1
                  address_line2:
                    type: string
                    nullable: true
                    description: Property address line 2
                  suburb:
                    type: string
                    description: Property suburb
                  state:
                    type: string
                    description: Property state
                  postcode:
                    type: string
                    description: Property postcode
                  country:
                    type: string
                    description: Property country
                  timezone:
                    type: string
                    nullable: true
                    description: Property timezone
                  created_at:
                    type: string
                    format: date-time
                    description: Creation timestamp
                  updated_at:
                    type: string
                    format: date-time
                    description: Last update timestamp
                  archived_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Archive timestamp (null if not archived)
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminCreatePropertyFunction.Arn}/invocations

  /admin/properties/{propertyId}:
    get:
      summary: Get property by ID (admin only)
      operationId: getProperty
      security:
        - bearerAuth: []
      description: Retrieve a specific property by ID
      parameters:
        - name: propertyId
          in: path
          required: true
          description: Property ID
          schema:
            type: string
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Property ID
                  ownerManagerSub:
                    type: string
                    description: Manager sub who owns this property
                  name:
                    type: string
                    description: Property name
                  addressLine1:
                    type: string
                    description: Property address line 1
                  addressLine2:
                    type: string
                    nullable: true
                    description: Property address line 2
                  suburb:
                    type: string
                    description: Property suburb
                  state:
                    type: string
                    description: Property state
                  postcode:
                    type: string
                    description: Property postcode
                  country:
                    type: string
                    description: Property country
                  timezone:
                    type: string
                    nullable: true
                    description: Property timezone
                  createdAt:
                    type: string
                    format: date-time
                    description: Creation timestamp
                  updatedAt:
                    type: string
                    format: date-time
                    description: Last update timestamp
                  archivedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Archive timestamp (null if not archived)
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Property not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: "2.0"
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminGetPropertyFunction.Arn}/invocations

    patch:
      summary: Update property (admin only)
      operationId: updateProperty
      security:
        - bearerAuth: []
      description: Update an existing property
      parameters:
        - name: propertyId
          in: path
          required: true
          description: Property ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
