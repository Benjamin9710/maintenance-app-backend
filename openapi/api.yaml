openapi: 3.0.0
info:
  title: Backend App API
  version: 1.0.0
  description: API for maintenance app backend

servers:
  - url: https://{ApiId}.execute-api.{Region}.amazonaws.com/v1
    description: Production server

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      description: Basic health check endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HealthCheckFunction.Arn}/invocations

  /db/health:
    get:
      summary: Database health check
      operationId: dbHealth
      description: Check database connectivity
      responses:
        '200':
          description: Database connection successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: connected
        '500':
          description: Database connection failed
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DbHealthFunction.Arn}/invocations

  /dynamo/health:
    get:
      summary: DynamoDB health check
      operationId: dynamoHealth
      description: Check DynamoDB connectivity
      responses:
        '200':
          description: DynamoDB connection successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: connected
        '500':
          description: DynamoDB connection failed
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DynamoHealthFunction.Arn}/invocations

  /me:
    get:
      summary: Get current user info
      operationId: me
      security:
        - bearerAuth: []
      description: Retrieve information about the currently authenticated user
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub:
                    type: string
                    description: User subject identifier
                  email:
                    type: string
                    nullable: true
                    description: User email address
                  persona:
                    type: string
                    enum: [manager, contractor, admin]
                    description: User persona/role
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MeFunction.Arn}/invocations

  /auth/session:
    post:
      summary: Create session
      operationId: createSession
      description: Create a new session after successful authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: JWT token from Cognito
                persona:
                  type: string
                  enum: [manager, contractor, admin]
                  description: User persona/role
              required:
                - token
                - persona
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Session token
                  expiresAt:
                    type: integer
                    description: Token expiration timestamp
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthSessionFunction.Arn}/invocations

  /auth/logout:
    post:
      summary: Logout session
      operationId: logoutSession
      security:
        - bearerAuth: []
      description: Invalidate the current session
      responses:
        '200':
          description: Session invalidated
        '401':
          description: Unauthorized
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLogoutFunction.Arn}/invocations

  /admin/managers:
    get:
      summary: List managers (admin only)
      operationId: listManagers
      security:
        - bearerAuth: []
      description: Retrieve list of all managers in the system with pagination support (updated 2026-02-19)
      parameters:
        - name: limit
          in: query
          description: Maximum number of managers to return (1-60, default = 60)
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 60
        - name: paginationToken
          in: query
          description: Token for pagination (from previous response)
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  managers:
                    type: array
                    items:
                      type: object
                      properties:
                        cognitoSub:
                          type: string
                        username:
                          type: string
                        email:
                          type: string
                          nullable: true
                        displayName:
                          type: string
                          nullable: true
                        givenName:
                          type: string
                          nullable: true
                        familyName:
                          type: string
                          nullable: true
                        phoneNumber:
                          type: string
                          nullable: true
                        status:
                          type: string
                        enabled:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        lastModifiedAt:
                          type: string
                          format: date-time
                  paginationToken:
                    type: string
                    nullable: true
                    description: Token for next page (null if no more pages)
                  hasMore:
                    type: boolean
                    description: Whether more pages are available
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminListManagersFunction.Arn}/invocations

    post:
      summary: Create manager (admin only)
      operationId: createManager
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                givenName:
                  type: string
                familyName:
                  type: string
                phoneNumber:
                  type: string
                  description: E.164 format recommended (e.g. +61400111222)
              required:
                - email
                - displayName
                - givenName
                - familyName
                - phoneNumber
      responses:
        '200':
          description: Manager created
          content:
            application/json:
              schema:
                type: object
                properties:
                  cognitoSub:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
                    nullable: true
                  displayName:
                    type: string
                    nullable: true
                  givenName:
                    type: string
                    nullable: true
                  familyName:
                    type: string
                    nullable: true
                  phoneNumber:
                    type: string
                    nullable: true
                  status:
                    type: string
                  enabled:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                  lastModifiedAt:
                    type: string
                    format: date-time
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminCreateManagerFunction.Arn}/invocations

  /admin/contractors:
    get:
      summary: List contractors (admin only)
      operationId: listContractors
      security:
        - bearerAuth: []
      description: Retrieve list of all contractors in the system with pagination support
      parameters:
        - name: limit
          in: query
          description: Maximum number of contractors to return (1-60, default = 60)
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 60
        - name: paginationToken
          in: query
          description: Token for pagination (from previous response)
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of contractors
          content:
            application/json:
              schema:
                type: object
                properties:
                  contractors:
                    type: array
                    items:
                      type: object
                      properties:
                        cognitoSub:
                          type: string
                        username:
                          type: string
                        email:
                          type: string
                          nullable: true
                        displayName:
                          type: string
                          nullable: true
                        givenName:
                          type: string
                          nullable: true
                        familyName:
                          type: string
                          nullable: true
                        phoneNumber:
                          type: string
                          nullable: true
                        status:
                          type: string
                        enabled:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        lastModifiedAt:
                          type: string
                          format: date-time
                  paginationToken:
                    type: string
                    nullable: true
                    description: Token for next page (null if no more pages)
                  hasMore:
                    type: boolean
                    description: Whether more pages are available
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminListContractorsFunction.Arn}/invocations

    post:
      summary: Create contractor (admin only)
      operationId: createContractor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                givenName:
                  type: string
                familyName:
                  type: string
                phoneNumber:
                  type: string
                  description: E.164 format recommended (e.g. +61400111222)
              required:
                - email
                - displayName
                - givenName
                - familyName
                - phoneNumber
      responses:
        '200':
          description: Contractor created
          content:
            application/json:
              schema:
                type: object
                properties:
                  cognitoSub:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
                    nullable: true
                  displayName:
                    type: string
                    nullable: true
                  givenName:
                    type: string
                    nullable: true
                  familyName:
                    type: string
                    nullable: true
                  phoneNumber:
                    type: string
                    nullable: true
                  status:
                    type: string
                  enabled:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                  lastModifiedAt:
                    type: string
                    format: date-time
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-amazon-apigateway-integration:
        type: aws_proxy
        payloadFormatVersion: '2.0'
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminCreateContractorFunction.Arn}/invocations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
